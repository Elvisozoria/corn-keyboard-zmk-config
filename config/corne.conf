# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

#dormir luego de 30 minutos sin uso
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

#aumenta la fuerza del bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#nombre del teclado
CONFIG_ZMK_KEYBOARD_NAME="corne_k"

# LEDs por tecla (feedback, no luz constante). Los maneja zmk-rgb-matrix, no el underglow de ZMK.
CONFIG_SPI=y
# Corta la corriente de los LEDs cuando no muestran nada (lo controlan los triggers del keymap)
CONFIG_ZMK_EXT_POWER=y
# Las macros stat_show/boot_st usan &tg_stat. Zephyr lo marca como error de orden de arranque, pero
# las macros de ZMK solo guardan el nombre del behavior y lo resuelven al ejecutarse: es un falso positivo.
CONFIG_CHECK_INIT_PRIORITIES=n
